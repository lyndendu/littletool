name: Build Text Cleaner for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/windows-text-cleaner
    paths:
      - "text-cleaner-windows/**"
      - ".github/workflows/build-text-cleaner-windows.yml"
  pull_request:
    paths:
      - "text-cleaner-windows/**"
      - ".github/workflows/build-text-cleaner-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: text-cleaner-windows/requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s text-cleaner-windows/tests -v

      - name: Build standalone executable
        shell: cmd
        run: text-cleaner-windows\build_windows.bat

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "text-cleaner-windows/dist/TextCleaner.exe")) {
            throw "TextCleaner.exe was not generated."
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TextCleaner-Windows
          path: text-cleaner-windows/dist/TextCleaner.exe
          if-no-files-found: error
          retention-days: 30
